<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f8">
  <title>Claim your promo code · PixVerse</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img src="/assets/pixverse-logo.svg" alt="PixVerse" width="1024" height="213">
    </header>
    <section class="card" aria-labelledby="title">
      <div class="content">
        <p class="kicker"><span aria-hidden="true"></span>Creator access</p>
        <h1 id="title">Claim your<br>promo code.</h1>
        <p class="intro">Enter the email you used to sign up for PixVerse to get your promo code.</p>
        <form id="claim">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com" aria-describedby="message">
          <button class="primary" type="submit"><span id="submit-label">Get my code</span><span aria-hidden="true">↗</span></button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <section class="result" id="result" aria-labelledby="result-label" hidden>
          <p id="result-label">YOUR PROMO CODE</p>
          <div class="code-row"><code id="code" tabindex="0"></code><button id="copy" type="button">Copy code</button></div>
        </section>
      </div>
    </section>
    <footer>PixVerse Creator Program</footer>
  </main>
</body>
</html>
