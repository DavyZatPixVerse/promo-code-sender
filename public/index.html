<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f4fb">
  <title>Claim your promo code · PixVerse</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>PixVerse</span></div>
    <section class="card" aria-labelledby="title">
      <div class="banner" aria-hidden="true">
        <span class="banner-label">PIXVERSE<br>CREATOR ACCESS</span>
        <svg class="spark" viewBox="0 0 160 130" fill="none">
          <path d="M78 2c2 37 22 57 59 59-37 2-57 22-59 59-2-37-22-57-59-59C56 59 76 39 78 2Z" fill="currentColor"/>
          <path d="M133 68c1 17 10 26 27 27-17 1-26 10-27 27-1-17-10-26-27-27 17-1 26-10 27-27ZM24 9c1 12 7 18 19 19-12 1-18 7-19 19-1-12-7-18-19-19 12-1 18-7 19-19Z" fill="currentColor" opacity=".55"/>
        </svg>
        <span class="banner-index">01 / CREATOR PASS</span>
      </div>
      <div class="content">
        <p class="kicker">YOUR CREATOR INVITE</p>
        <h1 id="title">Claim your<br>promo code<span>.</span></h1>
        <p class="intro">Enter the email address on your PixVerse invitation to find your personal promo code.</p>
        <form id="claim">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com" aria-describedby="message">
          <button class="primary" type="submit"><span id="submit-label">Get my code</span><span aria-hidden="true">↗</span></button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <section class="result" id="result" aria-labelledby="result-label" hidden>
          <p id="result-label">YOUR PROMO CODE</p>
          <div class="code-row"><code id="code" tabindex="0"></code><button id="copy" type="button">Copy code</button></div>
        </section>
      </div>
    </section>
    <footer>PixVerse Creator Program</footer>
  </main>
</body>
</html>
